<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trio Morse Comm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { touch-action: manipulation; }
        .morse-btn {
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.05s, background-color 0.1s;
        }
        .morse-btn:active {
            transform: scale(0.95);
            background-color: #3b82f6 !important;
        }
        .indicator-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-busy { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .status-idle { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
        
        /* Disable text selection during tapping */
        .noselect {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Login Screen -->
    <div id="login-screen" class="flex-grow flex flex-col items-center justify-center p-6">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
            <h1 class="text-3xl font-bold mb-8 text-center text-blue-400">Morse Access</h1>
            <p class="text-slate-400 mb-6 text-center">Select your station identifier:</p>
            <div class="grid gap-4">
                <button onclick="login('NG')" class="py-4 bg-slate-700 hover:bg-blue-600 rounded-xl font-bold text-xl transition-colors">NG</button>
                <button onclick="login('VD')" class="py-4 bg-slate-700 hover:bg-blue-600 rounded-xl font-bold text-xl transition-colors">VD</button>
                <button onclick="login('ST')" class="py-4 bg-slate-700 hover:bg-blue-600 rounded-xl font-bold text-xl transition-colors">ST</button>
            </div>
        </div>
    </div>

    <!-- Main App Screen (Hidden initially) -->
    <div id="app-screen" class="hidden flex-grow flex flex-col p-4 max-w-lg mx-auto w-full">
        <header class="flex justify-between items-center mb-8 bg-slate-800 p-4 rounded-xl border border-slate-700">
            <div>
                <span class="text-slate-400 text-sm block">STATION</span>
                <span id="my-id" class="text-2xl font-black text-blue-400">--</span>
            </div>
            <div class="text-right">
                <span class="text-slate-400 text-sm block">CHANNEL STATUS</span>
                <div class="flex items-center justify-end gap-2">
                    <span id="status-text" class="font-bold">IDLE</span>
                    <div id="status-indicator" class="indicator-dot status-idle"></div>
                </div>
            </div>
        </header>

        <div class="flex-grow flex flex-col items-center justify-center gap-8">
            <!-- Occupied Warning -->
            <div id="busy-msg" class="opacity-0 transition-opacity duration-300 text-center">
                <p class="text-red-400 font-bold animate-pulse">TRANSMISSION IN PROGRESS BY <span id="busy-user">?</span></p>
            </div>

            <!-- The Big Button -->
            <button 
                id="morse-pad" 
                class="morse-btn w-64 h-64 rounded-full bg-slate-800 border-8 border-slate-700 flex items-center justify-center shadow-2xl active:shadow-blue-500/50 disabled:opacity-50 disabled:cursor-not-allowed noselect"
                onpointerdown="startTransmit(event)"
                onpointerup="stopTransmit(event)"
                onpointerleave="stopTransmit(event)"
            >
                <span id="pad-label" class="text-4xl font-black">TAP</span>
            </button>

            <!-- Lock Toggle -->
            <div class="w-full flex flex-col items-center gap-2">
                <button 
                    id="lock-btn" 
                    onclick="toggleLock()"
                    class="w-full py-4 bg-red-600 hover:bg-red-700 rounded-xl font-bold transition-all disabled:opacity-30 flex items-center justify-center gap-2"
                >
                    <span id="lock-icon">🔓</span>
                    <span id="lock-text">LOCK CHANNEL</span>
                </button>
                <p class="text-xs text-slate-500 text-center px-4">Lock the channel to prevent others from interrupting your sequence.</p>
            </div>
        </div>

        <footer class="mt-8 text-center text-slate-600 text-xs">
            SECURE TRI-USER LINK ACTIVE
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Your provided Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAhgK_yy1gySmtKb6Y6NGbaBvVAk2XaT3A",
            authDomain: "trip-tracker-57ce0.firebaseapp.com",
            databaseURL: "https://trip-tracker-57ce0-default-rtdb.firebaseio.com",
            projectId: "trip-tracker-57ce0",
            storageBucket: "trip-tracker-57ce0.firebasestorage.app",
            messagingSenderId: "236146303848",
            appId: "1:236146303848:web:933f1e79e8a97687db6cdd",
            measurementId: "G-ZBPCS6QPR5"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Path used for the specific channel state
        const appId = 'trio-morse-comm-v1';
        const channelPath = `artifacts/${appId}/public/data/channel_state`;

        // Local State
        let currentUser = null;
        let isLockedByMe = false;
        let channelOwner = null;
        let audioCtx = null;
        let oscillator = null;
        let gainNode = null;
        let isTransmitting = false;

        // UI Elements
        const loginScreen = document.getElementById('login-screen');
        const appScreen = document.getElementById('app-screen');
        const myIdDisplay = document.getElementById('my-id');
        const statusText = document.getElementById('status-text');
        const statusIndicator = document.getElementById('status-indicator');
        const morsePad = document.getElementById('morse-pad');
        const lockBtn = document.getElementById('lock-btn');
        const lockText = document.getElementById('lock-text');
        const busyMsg = document.getElementById('busy-msg');
        const busyUserSpan = document.getElementById('busy-user');

        // Initialize Audio
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            gainNode = audioCtx.createGain();
            gainNode.gain.value = 0;
            gainNode.connect(audioCtx.destination);
            
            oscillator = audioCtx.createOscillator();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
            oscillator.connect(gainNode);
            oscillator.start();
        }

        function playTone() {
            if (!gainNode) initAudio();
            gainNode.gain.setTargetAtTime(0.5, audioCtx.currentTime, 0.005);
        }

        function stopTone() {
            if (gainNode) {
                gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.005);
            }
        }

        // Global Auth Login
        window.login = async (id) => {
            currentUser = id;
            initAudio();
            
            try {
                // Sign in anonymously to enable Firestore operations
                await signInAnonymously(auth);
            } catch (e) {
                console.error("Auth error:", e);
                // Even if auth fails, show UI (though Firestore will fail if rules are strict)
                showApp();
            }
        };

        function showApp() {
            loginScreen.classList.add('hidden');
            appScreen.classList.remove('hidden');
            myIdDisplay.innerText = currentUser;
        }

        // Main Auth Listener
        onAuthStateChanged(auth, (user) => {
            if (user && currentUser) {
                showApp();
                startSync();
            }
        });

        // Firestore Sync
        function startSync() {
            const channelDoc = doc(db, channelPath);

            // Listen for channel changes
            onSnapshot(channelDoc, (snapshot) => {
                const data = snapshot.data();
                
                if (data) {
                    channelOwner = data.owner;
                    const transmitting = data.isTransmitting;

                    // Update UI based on ownership
                    if (channelOwner && channelOwner !== currentUser) {
                        // Someone else has the channel
                        morsePad.disabled = true;
                        lockBtn.disabled = true;
                        statusText.innerText = 'BUSY';
                        statusIndicator.className = 'indicator-dot status-busy';
                        busyMsg.style.opacity = '1';
                        busyUserSpan.innerText = channelOwner;
                        
                        // Audio response to remote transmission
                        if (transmitting) playTone();
                        else stopTone();
                    } else {
                        // Channel is free or owned by me
                        morsePad.disabled = false;
                        lockBtn.disabled = false;
                        busyMsg.style.opacity = '0';

                        if (isLockedByMe) {
                            statusText.innerText = 'LOCKED';
                            statusIndicator.className = 'indicator-dot status-busy';
                            lockText.innerText = 'UNLOCK CHANNEL';
                            lockBtn.classList.replace('bg-red-600', 'bg-green-600');
                        } else {
                            statusText.innerText = 'IDLE';
                            statusIndicator.className = 'indicator-dot status-idle';
                            lockText.innerText = 'LOCK CHANNEL';
                            lockBtn.classList.replace('bg-green-600', 'bg-red-600');
                        }
                    }
                } else {
                    resetChannelLocally();
                }
            }, (err) => console.error("Firestore sync error:", err));
        }

        function resetChannelLocally() {
            channelOwner = null;
            morsePad.disabled = false;
            lockBtn.disabled = false;
            statusText.innerText = 'IDLE';
            statusIndicator.className = 'indicator-dot status-idle';
        }

        // Lock Control
        window.toggleLock = async () => {
            if (!auth.currentUser) return;
            const channelDoc = doc(db, channelPath);
            
            try {
                if (isLockedByMe) {
                    await updateDoc(channelDoc, { owner: null, isTransmitting: false });
                    isLockedByMe = false;
                } else {
                    if (channelOwner && channelOwner !== currentUser) return;
                    await setDoc(channelDoc, { owner: currentUser, isTransmitting: false });
                    isLockedByMe = true;
                }
            } catch (e) {
                console.error("Lock error:", e);
            }
        };

        // Morse Pad Control
        window.startTransmit = async (e) => {
            if (e.cancelable) e.preventDefault();
            if (morsePad.disabled || !auth.currentUser) return;
            
            isTransmitting = true;
            playTone();

            const channelDoc = doc(db, channelPath);
            try {
                await setDoc(channelDoc, { 
                    owner: currentUser, 
                    isTransmitting: true,
                    locked: isLockedByMe 
                });
            } catch (e) {
                console.error("Transmit error:", e);
            }
        };

        window.stopTransmit = async (e) => {
            if (!isTransmitting || !auth.currentUser) return;
            isTransmitting = false;
            stopTone();

            const channelDoc = doc(db, channelPath);
            
            try {
                if (isLockedByMe) {
                    await updateDoc(channelDoc, { isTransmitting: false });
                } else {
                    await updateDoc(channelDoc, { owner: null, isTransmitting: false });
                }
            } catch (e) {
                console.error("Stop transmit error:", e);
            }
        };

        // Tab/Window Visibility - Auto release lock if page hidden
        document.addEventListener('visibilitychange', async () => {
            if (document.hidden && isLockedByMe && auth.currentUser) {
                const channelDoc = doc(db, channelPath);
                await updateDoc(channelDoc, { owner: null, isTransmitting: false });
                isLockedByMe = false;
            }
        });

    </script>
</body>
</html>
