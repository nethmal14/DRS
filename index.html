<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MORSE-TECH // NETWORK_V1.0</title>
    <style>
        :root {
            --bg-color: #0a0e14;
            --panel-color: #1a222d;
            --neon-green: #39ff14;
            --neon-cyan: #00f3ff;
            --alert-red: #ff3131;
            --font-main: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--neon-green);
            font-family: var(--font-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-transform: uppercase;
        }

        #login-screen, #app-screen, #full-screen {
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
            border: 2px solid var(--neon-green);
            padding: 20px;
            background: var(--panel-color);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
        }

        h1 {
            font-size: 1.2rem;
            margin: 0 0 20px 0;
            text-align: center;
            border-bottom: 2px solid var(--neon-green);
            padding-bottom: 10px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 15px;
            color: var(--neon-cyan);
        }

        .callsign-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .btn {
            background: transparent;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            font-family: var(--font-main);
            padding: 15px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .btn:active:not(:disabled) {
            background: var(--neon-green);
            color: var(--bg-color);
        }

        .btn:disabled {
            border-color: #444;
            color: #444;
            cursor: not-allowed;
        }

        .btn-lock {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .btn-lock.active {
            background: var(--neon-cyan);
            color: var(--bg-color);
        }

        #transmit-btn {
            height: 150px;
            margin: 20px 0;
            font-size: 1.5rem;
            background: rgba(57, 255, 20, 0.05);
        }

        #transmit-btn.active {
            background: var(--neon-green);
            color: var(--bg-color);
            box-shadow: 0 0 30px var(--neon-green);
        }

        .monitor {
            background: #000;
            border: 1px inset var(--neon-green);
            padding: 10px;
            height: 100px;
            overflow-y: auto;
            font-size: 0.9rem;
            margin-bottom: 15px;
            color: var(--neon-cyan);
        }

        .alert {
            color: var(--alert-red);
            text-align: center;
            font-weight: bold;
        }

        .blink {
            animation: blinker 1s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" style="display: flex;">
        <h1>NET_GATEWAY v1.0</h1>
        <p>SELECT OPERATOR CALLSIGN:</p>
        <div id="callsign-list" class="callsign-grid">
            <!-- Buttons injected by JS -->
        </div>
    </div>

    <!-- APP SCREEN -->
    <div id="app-screen">
        <div class="status-bar">
            <div>ID: <span id="my-callsign">--</span></div>
            <div id="lock-status">UNLOCKED</div>
        </div>

        <div class="monitor" id="log">
            SYSTEM INITIALIZED...<br>
            AWAITING SIGNAL...
        </div>

        <div class="status-bar">
            <div>TX: <span id="current-tx">IDLE</span></div>
        </div>

        <button id="transmit-btn" class="btn">TRANSMIT</button>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button id="lock-btn" class="btn btn-lock">LOCK CH</button>
            <button id="unlock-btn" class="btn btn-lock" disabled>RELEASE</button>
        </div>
    </div>

    <!-- CHANNEL FULL SCREEN -->
    <div id="full-screen">
        <h1 class="alert">ACCESS DENIED</h1>
        <p class="alert blink">CHANNEL FULL</p>
        <p style="text-align: center; font-size: 0.8rem;">ALL CALLSIGNS (NG, VD, ST) ARE CURRENTLY ASSIGNED.</p>
        <button onclick="location.reload()" class="btn" style="margin-top: 20px;">RETRY CONNECTION</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, onDisconnect, serverTimestamp, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAhgK_yy1gySmtKb6Y6NGbaBvVAk2XaT3A",
            authDomain: "trip-tracker-57ce0.firebaseapp.com",
            databaseURL: "https://trip-tracker-57ce0-default-rtdb.firebaseio.com",
            projectId: "trip-tracker-57ce0",
            storageBucket: "trip-tracker-57ce0.firebasestorage.app",
            messagingSenderId: "236146303848",
            appId: "1:236146303848:web:933f1e79e8a97687db6cdd",
            measurementId: "G-ZBPCS6QPR5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // App State
        let myCallsign = null;
        const availableCallsigns = ["NG", "VD", "ST"];
        const DOT_DURATION = 120;
        const DASH_DURATION = 360;
        
        // Audio Logic
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let oscillator = null;
        let gainNode = null;

        function playTone(duration) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            
            // Envelope to prevent clicks
            g.gain.setValueAtTime(0, audioCtx.currentTime);
            g.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.01);
            g.gain.setValueAtTime(0.1, audioCtx.currentTime + (duration/1000) - 0.01);
            g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + (duration/1000));
            
            osc.connect(g);
            g.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + (duration/1000));
        }

        // UI Selectors
        const loginScreen = document.getElementById('login-screen');
        const appScreen = document.getElementById('app-screen');
        const fullScreen = document.getElementById('full-screen');
        const callsignList = document.getElementById('callsign-list');
        const transmitBtn = document.getElementById('transmit-btn');
        const lockBtn = document.getElementById('lock-btn');
        const unlockBtn = document.getElementById('unlock-btn');
        const log = document.getElementById('log');
        const currentTxDisplay = document.getElementById('current-tx');
        const lockStatusDisplay = document.getElementById('lock-status');

        // Logic variables
        let isTransmitting = false;
        let pressStartTime = 0;
        let channelState = {
            transmitter: null,
            lockedBy: null,
            signal: null // { type: 'DOT'|'DASH', ts: timestamp }
        };

        // Initialize Users / Occupancy
        onValue(ref(db, 'users'), (snapshot) => {
            const users = snapshot.val() || {};
            callsignList.innerHTML = '';
            let takenCount = 0;

            availableCallsigns.forEach(cs => {
                const isTaken = users[cs] && users[cs].online;
                if (isTaken) takenCount++;

                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = cs + (isTaken ? ' (BUSY)' : ' (OPEN)');
                btn.disabled = isTaken;
                btn.onclick = () => selectCallsign(cs);
                callsignList.appendChild(btn);
            });

            if (takenCount === 3 && !myCallsign) {
                loginScreen.style.display = 'none';
                fullScreen.style.display = 'flex';
            }
        });

        async function selectCallsign(cs) {
            myCallsign = cs;
            const userRef = ref(db, `users/${cs}`);
            await set(userRef, { online: true, lastSeen: serverTimestamp() });
            onDisconnect(userRef).set({ online: false });

            document.getElementById('my-callsign').innerText = cs;
            loginScreen.style.display = 'none';
            appScreen.style.display = 'flex';
            initMainListeners();
        }

        function initMainListeners() {
            // Channel State Sync
            onValue(ref(db, 'channel'), (snapshot) => {
                const data = snapshot.val() || {};
                channelState = data;

                // Update UI
                currentTxDisplay.innerText = data.transmitter || 'IDLE';
                if (data.lockedBy) {
                    lockStatusDisplay.innerText = `LOCKED BY ${data.lockedBy}`;
                    lockStatusDisplay.style.color = 'var(--neon-cyan)';
                    lockBtn.disabled = true;
                    unlockBtn.disabled = data.lockedBy !== myCallsign;
                } else {
                    lockStatusDisplay.innerText = `UNLOCKED`;
                    lockStatusDisplay.style.color = 'var(--neon-green)';
                    lockBtn.disabled = false;
                    unlockBtn.disabled = true;
                }

                // Global Disabled State for Transmit
                const canTransmit = !data.transmitter || data.transmitter === myCallsign;
                const isLockedByOther = data.lockedBy && data.lockedBy !== myCallsign;
                
                transmitBtn.disabled = (data.transmitter && data.transmitter !== myCallsign) || isLockedByOther;
            });

            // Signal Listener for Audio
            onValue(ref(db, 'signal'), (snapshot) => {
                const sig = snapshot.val();
                if (sig && sig.sender !== myCallsign) {
                    const dur = sig.type === 'DOT' ? DOT_DURATION : DASH_DURATION;
                    playTone(dur);
                    const line = document.createElement('div');
                    line.innerText = `> ${sig.sender}: ${sig.type}`;
                    log.prepend(line);
                }
            });
        }

        // Transmit Interaction
        const startTransmit = (e) => {
            e.preventDefault();
            if (transmitBtn.disabled || isTransmitting) return;
            
            isTransmitting = true;
            pressStartTime = Date.now();
            transmitBtn.classList.add('active');
            
            // Tell DB we are transmitting
            update(ref(db, 'channel'), { transmitter: myCallsign });
        };

        const endTransmit = (e) => {
            e.preventDefault();
            if (!isTransmitting) return;

            const duration = Date.now() - pressStartTime;
            const type = duration > 200 ? 'DASH' : 'DOT';
            const audioDur = type === 'DOT' ? DOT_DURATION : DASH_DURATION;

            // Trigger local audio
            playTone(audioDur);
            
            // Update Log
            const line = document.createElement('div');
            line.innerText = `< YOU: ${type}`;
            log.prepend(line);

            // Broadcast Signal
            set(ref(db, 'signal'), {
                type: type,
                sender: myCallsign,
                ts: serverTimestamp()
            });

            // Clear Transmitter Status
            setTimeout(() => {
                update(ref(db, 'channel'), { transmitter: null });
                isTransmitting = false;
                transmitBtn.classList.remove('active');
            }, audioDur);
        };

        // Desktop
        transmitBtn.onmousedown = startTransmit;
        window.onmouseup = endTransmit;
        // Mobile
        transmitBtn.ontouchstart = startTransmit;
        window.ontouchend = endTransmit;

        // Lock Buttons
        lockBtn.onclick = () => {
            update(ref(db, 'channel'), { lockedBy: myCallsign });
        };

        unlockBtn.onclick = () => {
            update(ref(db, 'channel'), { lockedBy: null });
        };

        // Auto-scroll log
        const observer = new MutationObserver(() => {
            log.scrollTop = 0;
        });
        observer.observe(log, { childList: true });

    </script>
</body>
</html>
