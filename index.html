<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Group Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-bg: #F2F2F7;
            --ios-secondary: #8E8E93;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--ios-bg);
            height: 100vh;
            overflow: hidden;
        }
        .ios-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.8);
        }
        .chat-bubble-me {
            background-color: #0084FF;
            color: white;
            border-radius: 18px 18px 2px 18px;
        }
        .chat-bubble-them {
            background-color: #E9E9EB;
            color: black;
            border-radius: 18px 18px 18px 2px;
        }
        .message-container {
            height: calc(100vh - 120px);
            overflow-y: auto;
            scrollbar-width: none;
        }
        .message-container::-webkit-scrollbar { display: none; }
        .hidden { display: none; }
        
        /* Telegram style FAB */
        .fab {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            background-color: var(--ios-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
            cursor: pointer;
            z-index: 40;
        }
    </style>
</head>
<body>

    <!-- Selection Screen -->
    <div id="selection-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-white p-6">
        <h1 class="text-3xl font-bold mb-8 text-black">Who are you?</h1>
        <div class="grid grid-cols-1 gap-4 w-full max-w-xs" id="user-list"></div>
    </div>

    <!-- Main Platform -->
    <div id="main-platform" class="hidden flex flex-col h-screen max-w-md mx-auto bg-white shadow-2xl relative">
        
        <!-- Header -->
        <header class="ios-blur sticky top-0 z-30 p-4 border-b border-gray-200 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button id="back-btn" class="text-blue-500 hidden"><i class="fas fa-chevron-left text-xl"></i></button>
                <div id="header-info" class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold" id="active-avatar">M</div>
                    <div>
                        <h2 class="font-semibold text-lg" id="active-chat-name">Messenger</h2>
                        <p class="text-xs text-green-500" id="chat-status">online</p>
                    </div>
                </div>
            </div>
            <div id="chat-actions" class="hidden flex gap-4 text-blue-500 text-xl">
                <button onclick="triggerCall()"><i class="fas fa-phone-alt"></i></button>
                <button onclick="triggerCall()"><i class="fas fa-video"></i></button>
            </div>
        </header>

        <!-- Sidebar (Recent Conversations) -->
        <div id="sidebar" class="flex-1 overflow-y-auto bg-white relative">
            <div class="p-4">
                <div class="bg-gray-100 rounded-xl p-2 flex items-center mb-4">
                    <i class="fas fa-search text-gray-400 ml-2"></i>
                    <input type="text" placeholder="Search chats" class="bg-transparent border-none outline-none ml-2 w-full text-sm">
                </div>
                
                <div id="recent-chats-list" class="space-y-1">
                    <!-- Only chats with history or explicitly started will show here -->
                    <div id="empty-state" class="text-center py-20 text-gray-400">
                        <i class="fas fa-comments text-4xl mb-4 opacity-20"></i>
                        <p>No messages yet.<br>Tap the + button to start.</p>
                    </div>
                </div>
            </div>

            <!-- Start New Chat FAB -->
            <div class="fab" onclick="toggleNewChatModal()">
                <i class="fas fa-plus text-xl"></i>
            </div>
        </div>

        <!-- Chat View -->
        <div id="chat-view" class="hidden flex-1 flex flex-col bg-gray-50 relative">
            <div id="message-list" class="message-container p-4 space-y-4"></div>

            <!-- Input Area -->
            <div class="p-3 ios-blur border-t border-gray-200">
                <div class="flex items-end gap-2">
                    <button class="text-blue-500 p-2 mb-1" onclick="document.getElementById('file-input').click()">
                        <i class="fas fa-plus text-xl"></i>
                    </button>
                    <input type="file" id="file-input" class="hidden" accept="image/*" onchange="handleImageUpload(event)">
                    
                    <div class="flex-1 bg-white border border-gray-200 rounded-2xl p-2 min-h-[40px] max-h-32 overflow-y-auto flex items-center">
                        <textarea id="msg-input" placeholder="Message" class="w-full outline-none resize-none text-sm px-2 py-1 leading-tight" rows="1"></textarea>
                        <button class="text-gray-400 px-2" onclick="toggleEmoji()"><i class="far fa-smile text-xl"></i></button>
                    </div>
                    
                    <button id="send-btn" class="bg-blue-500 text-white rounded-full w-10 h-10 flex items-center justify-center mb-1">
                        <i class="fas fa-arrow-up"></i>
                    </button>
                </div>
                <div id="emoji-picker" class="hidden grid grid-cols-6 gap-2 p-2 mt-2 bg-white rounded-xl shadow-lg border">
                    <span class="cursor-pointer text-xl text-center" onclick="addEmoji('😊')">😊</span>
                    <span class="cursor-pointer text-xl text-center" onclick="addEmoji('😂')">😂</span>
                    <span class="cursor-pointer text-xl text-center" onclick="addEmoji('❤️')">❤️</span>
                    <span class="cursor-pointer text-xl text-center" onclick="addEmoji('🔥')">🔥</span>
                    <span class="cursor-pointer text-xl text-center" onclick="addEmoji('📍')">📍</span>
                    <span class="cursor-pointer text-xl text-center" onclick="addEmoji('📸')">📸</span>
                </div>
            </div>
        </div>
    </div>

    <!-- New Chat/Group Modal -->
    <div id="new-chat-modal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl overflow-hidden animate-slide-up">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center">
                <h3 class="font-bold text-lg">New Message</h3>
                <button onclick="toggleNewChatModal()" class="text-blue-500 font-medium">Cancel</button>
            </div>
            <div class="p-2 max-h-[60vh] overflow-y-auto">
                <!-- Group option only for Nethmal -->
                <div id="group-creation-opt" class="hidden p-3 mb-2 flex items-center gap-3 hover:bg-gray-50 rounded-xl cursor-pointer text-blue-600" onclick="startNewGroup()">
                    <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center"><i class="fas fa-users"></i></div>
                    <span class="font-semibold">Create New Group</span>
                </div>
                
                <p class="text-xs font-bold text-gray-400 px-3 py-2 uppercase tracking-wider">Contacts</p>
                <div id="contacts-list"></div>
            </div>
        </div>
    </div>

    <!-- Call Overlay -->
    <div id="call-overlay" class="hidden fixed inset-0 z-[60] bg-black/90 flex flex-col items-center justify-center text-white">
        <div class="w-24 h-24 rounded-full bg-gray-600 flex items-center justify-center text-4xl mb-4 font-bold" id="call-avatar">?</div>
        <h2 class="text-2xl font-semibold" id="call-name">Calling...</h2>
        <p class="text-gray-400 mt-2">Connecting...</p>
        <div class="mt-20 flex gap-12">
            <button onclick="endCall()" class="w-16 h-16 bg-red-500 rounded-full flex items-center justify-center"><i class="fas fa-phone-slash text-2xl"></i></button>
            <button class="w-16 h-16 bg-green-500 rounded-full flex items-center justify-center"><i class="fas fa-video text-2xl"></i></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, orderBy, serverTimestamp, doc, setDoc, deleteDoc, getDocs, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAhgK_yy1gySmtKb6Y6NGbaBvVAk2XaT3A",
            authDomain: "trip-tracker-57ce0.firebaseapp.com",
            projectId: "trip-tracker-57ce0",
            storageBucket: "trip-tracker-57ce0.firebasestorage.app",
            messagingSenderId: "236146303848",
            appId: "1:236146303848:web:933f1e79e8a97687db6cdd"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = "trip-tracker-57ce0";

        const users = ["Nethmal", "Chamu", "Hasandi", "Pinu", "Pavani"];
        let currentUser = null;
        let activeChatId = null;
        let unsubscribeMessages = null;
        let activeConversations = new Set();

        window.onload = () => {
            const userList = document.getElementById('user-list');
            users.forEach(name => {
                const btn = document.createElement('button');
                btn.className = "p-4 bg-blue-50 hover:bg-blue-500 hover:text-white rounded-2xl font-bold transition-all text-blue-600";
                btn.innerText = name;
                btn.onclick = () => loginAs(name);
                userList.appendChild(btn);
            });
            initAuth();
        };

        async function initAuth() {
            await signInAnonymously(auth);
        }

        function loginAs(name) {
            currentUser = name;
            document.getElementById('selection-screen').classList.add('hidden');
            document.getElementById('main-platform').classList.remove('hidden');
            
            // Privilege check for Nethmal
            if (currentUser === "Nethmal") {
                document.getElementById('group-creation-opt').classList.remove('hidden');
            }

            renderContacts();
            listenToConversations();
            cleanupOldMessages();
            requestNotificationPermission();
        }

        function renderContacts() {
            const list = document.getElementById('contacts-list');
            list.innerHTML = "";
            users.filter(u => u !== currentUser).forEach(user => {
                const div = document.createElement('div');
                div.className = "flex items-center p-3 hover:bg-gray-50 rounded-xl cursor-pointer";
                div.onclick = () => {
                    const chatId = [currentUser, user].sort().join('_');
                    toggleNewChatModal();
                    openChat(chatId, user, user[0]);
                };
                div.innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center text-gray-600 font-bold mr-3">${user[0]}</div>
                    <span class="font-medium">${user}</span>
                `;
                list.appendChild(div);
            });
        }

        // Only show chats that actually have messages or were just started
        function listenToConversations() {
            // We listen for any message involving the current user
            const q = query(
                collection(db, 'artifacts', appId, 'public', 'data', 'messages'),
                orderBy('timestamp', 'desc')
            );

            onSnapshot(q, (snapshot) => {
                const recentList = document.getElementById('recent-chats-list');
                const chats = {};
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    // Check if this chat belongs to the user
                    if (data.chatId.includes(currentUser) || data.chatId.startsWith('group_')) {
                        if (!chats[data.chatId]) {
                            chats[data.chatId] = data;
                        }
                    }
                });

                const chatIds = Object.keys(chats);
                if (chatIds.length > 0) {
                    document.getElementById('empty-state').classList.add('hidden');
                    recentList.innerHTML = "";
                    chatIds.forEach(id => {
                        const lastMsg = chats[id];
                        let title, initial;
                        
                        if (id.startsWith('group_')) {
                            title = "Trip Group"; // Or custom group name if implemented
                            initial = "G";
                        } else {
                            title = id.replace(currentUser, "").replace("_", "");
                            initial = title[0];
                        }

                        const div = document.createElement('div');
                        div.className = "flex items-center p-3 hover:bg-gray-100 rounded-lg cursor-pointer";
                        div.onclick = () => openChat(id, title, initial);
                        div.innerHTML = `
                            <div class="w-12 h-12 rounded-full ${id.startsWith('group_') ? 'bg-indigo-500' : 'bg-gray-200'} flex items-center justify-center text-white font-bold mr-3">${initial}</div>
                            <div class="flex-1 border-b border-gray-100 pb-2">
                                <div class="flex justify-between items-center">
                                    <span class="font-semibold">${title}</span>
                                    <span class="text-xs text-gray-400">
                                        ${lastMsg.timestamp ? new Date(lastMsg.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : ''}
                                    </span>
                                </div>
                                <p class="text-sm text-gray-500 truncate">${lastMsg.sender === currentUser ? 'You: ' : ''}${lastMsg.text || '📷 Photo'}</p>
                            </div>
                        `;
                        recentList.appendChild(div);
                    });
                }
            });
        }

        window.toggleNewChatModal = () => {
            document.getElementById('new-chat-modal').classList.toggle('hidden');
        };

        window.startNewGroup = () => {
            toggleNewChatModal();
            openChat('group_main', 'Main Group', 'G');
        };

        window.openChat = (chatId, title, initial) => {
            activeChatId = chatId;
            document.getElementById('sidebar').classList.add('hidden');
            document.getElementById('chat-view').classList.remove('hidden');
            document.getElementById('back-btn').classList.remove('hidden');
            document.getElementById('chat-actions').classList.remove('hidden');
            document.getElementById('active-avatar').innerText = initial;
            document.getElementById('active-chat-name').innerText = title;
            
            listenForMessages(chatId);
        };

        document.getElementById('back-btn').onclick = () => {
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('chat-view').classList.add('hidden');
            document.getElementById('back-btn').classList.add('hidden');
            document.getElementById('chat-actions').classList.add('hidden');
            document.getElementById('active-chat-name').innerText = "Messenger";
            if (unsubscribeMessages) unsubscribeMessages();
        };

        function listenForMessages(chatId) {
            if (unsubscribeMessages) unsubscribeMessages();
            const q = query(
                collection(db, 'artifacts', appId, 'public', 'data', 'messages'),
                where('chatId', '==', chatId),
                orderBy('timestamp', 'asc')
            );

            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                const messageList = document.getElementById('message-list');
                messageList.innerHTML = "";
                snapshot.forEach((doc) => renderMessage(doc.data()));
                messageList.scrollTop = messageList.scrollHeight;
                
                if(document.hidden && snapshot.docChanges().some(c => c.type === 'added')) {
                   const lastMsg = snapshot.docs[snapshot.docs.length-1].data();
                   if(lastMsg.sender !== currentUser) {
                       new Notification(`${lastMsg.sender}`, { body: lastMsg.text || "Sent a photo" });
                   }
                }
            });
        }

        function renderMessage(data) {
            const isMe = data.sender === currentUser;
            const msgList = document.getElementById('message-list');
            const div = document.createElement('div');
            div.className = `flex ${isMe ? 'justify-end' : 'justify-start'} mb-2`;
            
            div.innerHTML = `
                <div class="max-w-[80%]">
                    ${!isMe ? `<p class="text-[10px] text-gray-500 ml-2 mb-1 font-semibold">${data.sender}</p>` : ''}
                    <div class="p-3 ${isMe ? 'chat-bubble-me' : 'chat-bubble-them'}">
                        ${data.image ? `<img src="${data.image}" class="rounded-lg mb-2 max-w-full">` : ''}
                        <p class="text-sm">${data.text || ''}</p>
                    </div>
                    <p class="text-[9px] text-gray-400 mt-1 ${isMe ? 'text-right' : 'text-left'}">
                        ${data.timestamp ? new Date(data.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '...'}
                    </p>
                </div>
            `;
            msgList.appendChild(div);
        }

        async function sendMessage(text = "", image = null) {
            const input = document.getElementById('msg-input');
            const msg = text || input.value;
            if(!msg && !image) return;

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), {
                    chatId: activeChatId,
                    sender: currentUser,
                    text: msg,
                    image: image,
                    timestamp: serverTimestamp(),
                    expiry: Date.now() + (36 * 60 * 60 * 1000)
                });
                input.value = "";
                input.style.height = 'auto';
            } catch (e) { console.error(e); }
        }

        document.getElementById('send-btn').onclick = () => sendMessage();
        
        window.handleImageUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => sendMessage("", ev.target.result);
            reader.readAsDataURL(file);
        };

        window.toggleEmoji = () => document.getElementById('emoji-picker').classList.toggle('hidden');
        window.addEmoji = (emoji) => {
            document.getElementById('msg-input').value += emoji;
            document.getElementById('emoji-picker').classList.add('hidden');
        };

        async function cleanupOldMessages() {
            const now = Date.now();
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), where('expiry', '<', now));
            const snapshot = await getDocs(q);
            snapshot.forEach(async (d) => await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'messages', d.id)));
        }

        function requestNotificationPermission() {
            if ("Notification" in window) Notification.requestPermission();
        }

        window.triggerCall = () => {
            const name = document.getElementById('active-chat-name').innerText;
            const initial = document.getElementById('active-avatar').innerText;
            document.getElementById('call-name').innerText = name;
            document.getElementById('call-avatar').innerText = initial;
            document.getElementById('call-overlay').classList.remove('hidden');
        };

        window.endCall = () => document.getElementById('call-overlay').classList.add('hidden');

        const tx = document.getElementById('msg-input');
        tx.addEventListener("input", function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });
    </script>
</body>
</html>
