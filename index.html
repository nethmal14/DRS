<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trio Morse Comm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
        .tap-zone {
            -webkit-tap-highlight-color: transparent;
            transition: all 0.1s ease;
        }
        .tap-zone:active:not(:disabled) {
            transform: scale(0.96);
            background-color: #3b82f6 !important;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans overflow-hidden">

    <!-- Login screen -->
    <div id="login-layer" class="fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-4xl font-black mb-2 text-blue-500 tracking-tighter">MORSE LINK</h1>
        <p class="text-slate-500 mb-10 uppercase text-xs tracking-[0.2em]">Secure Tri-Station Network</p>
        
        <div class="grid grid-cols-1 gap-4 w-full max-w-xs">
            <button onclick="bootApp('NG')" class="py-5 bg-slate-900 border border-slate-800 rounded-2xl font-bold hover:bg-slate-800 active:bg-blue-600 transition-all text-xl">STATION NG</button>
            <button onclick="bootApp('VD')" class="py-5 bg-slate-900 border border-slate-800 rounded-2xl font-bold hover:bg-slate-800 active:bg-blue-600 transition-all text-xl">STATION VD</button>
            <button onclick="bootApp('ST')" class="py-5 bg-slate-900 border border-slate-800 rounded-2xl font-bold hover:bg-slate-800 active:bg-blue-600 transition-all text-xl">STATION ST</button>
        </div>
        <p class="mt-8 text-slate-600 text-[10px] uppercase tracking-widest">Tap to initialize station and audio</p>
    </div>

    <!-- Main UI -->
    <div id="main-ui" class="flex-grow flex flex-col p-6 opacity-0 transition-opacity duration-500">
        <header class="flex justify-between items-end mb-12">
            <div>
                <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Operator</p>
                <h2 id="display-id" class="text-3xl font-black text-blue-500">--</h2>
            </div>
            <div class="text-right">
                <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Network Status</p>
                <div class="flex items-center justify-end gap-2">
                    <span id="status-label" class="font-bold text-sm">INITIALIZING</span>
                    <span id="status-dot" class="status-dot bg-slate-700"></span>
                </div>
            </div>
        </header>

        <div class="flex-grow flex flex-col items-center justify-center">
            <!-- Transmission Alert -->
            <div id="incoming-alert" class="mb-10 h-6 flex items-center justify-center gap-2 text-red-500 font-bold tracking-widest text-xs invisible">
                <span class="pulse">📡</span> 
                INCOMING FROM <span id="sender-name">--</span>
            </div>

            <!-- Morse Key -->
            <button 
                id="morse-key" 
                class="tap-zone w-64 h-64 rounded-full bg-slate-900 border-4 border-slate-800 shadow-2xl flex flex-col items-center justify-center disabled:opacity-20 disabled:grayscale transition-all"
                onpointerdown="pressKey(event)"
                onpointerup="releaseKey(event)"
                onpointerleave="releaseKey(event)"
            >
                <span id="key-emoji" class="text-5xl mb-2">⚡</span>
                <span class="font-black text-lg tracking-widest uppercase">Transmit</span>
            </button>

            <!-- Channel Lock -->
            <div class="mt-16 w-full max-w-xs">
                <button 
                    id="lock-toggle" 
                    onclick="toggleLock()"
                    class="w-full py-4 bg-slate-900 border border-slate-800 rounded-xl flex items-center justify-center gap-3 font-bold text-sm tracking-widest disabled:opacity-20 transition-all"
                >
                    <span id="lock-emoji">🔓</span>
                    <span id="lock-label">LOCK CHANNEL</span>
                </button>
            </div>
        </div>

        <footer class="mt-auto pt-10 flex justify-center">
            <div class="px-3 py-1 bg-slate-900 rounded-full border border-slate-800 flex items-center gap-2">
                <div class="w-1.5 h-1.5 rounded-full bg-green-500 pulse"></div>
                <span class="text-[9px] uppercase font-bold text-slate-500 tracking-tighter tracking-widest">Live Sync Enabled</span>
            </div>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyAhgK_yy1gySmtKb6Y6NGbaBvVAk2XaT3A",
            authDomain: "trip-tracker-57ce0.firebaseapp.com",
            projectId: "trip-tracker-57ce0",
            storageBucket: "trip-tracker-57ce0.firebasestorage.app",
            messagingSenderId: "236146303848",
            appId: "1:236146303848:web:933f1e79e8a97687db6cdd"
        };

        // INIT FIREBASE
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const channelDocRef = doc(db, 'artifacts/trio-morse/public/data/state');

        // APP STATE
        let stationId = null;
        let audioCtx = null;
        let oscillator = null;
        let gainNode = null;
        let localPress = false;
        let isLockedByMe = false;

        // UI REFS
        const ui = {
            login: document.getElementById('login-layer'),
            main: document.getElementById('main-ui'),
            id: document.getElementById('display-id'),
            status: document.getElementById('status-label'),
            dot: document.getElementById('status-indicator'),
            key: document.getElementById('morse-key'),
            keyEmoji: document.getElementById('pad-emoji'),
            lockBtn: document.getElementById('lock-toggle'),
            lockLabel: document.getElementById('lock-label'),
            lockEmoji: document.getElementById('lock-emoji'),
            alert: document.getElementById('incoming-alert'),
            sender: document.getElementById('sender-name')
        };

        // BOOTSTRAP
        window.bootApp = async (id) => {
            stationId = id;
            
            // 1. Setup Audio (MUST be on user click)
            setupAudio();
            
            // 2. Hide Login
            ui.login.style.display = 'none';
            ui.main.classList.remove('opacity-0');
            ui.id.innerText = stationId;

            // 3. Auth and Sync
            try {
                await signInAnonymously(auth);
                startSync();
            } catch (err) {
                console.error("Auth failed:", err);
                alert("Connection failed. Check console.");
            }
        };

        function setupAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.connect(audioCtx.destination);

            oscillator = audioCtx.createOscillator();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(650, audioCtx.currentTime);
            oscillator.connect(gainNode);
            oscillator.start();
            
            // Resume if suspended
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function startSync() {
            onSnapshot(channelDocRef, (snap) => {
                const data = snap.data();
                if (!data) {
                    // Initialize if empty
                    setDoc(channelDocRef, { activeUser: null, isPressing: false, isLocked: false });
                    return;
                }

                const { activeUser, isPressing, isLocked } = data;

                // AUDIO LOGIC
                // We play sound if anyone is pressing (including us, so the lag feels natural)
                if (isPressing) {
                    gainNode.gain.setTargetAtTime(0.2, audioCtx.currentTime, 0.01);
                } else {
                    gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.01);
                }

                // UI UPDATE LOGIC
                const isForeignUser = activeUser && activeUser !== stationId;
                
                if (isForeignUser) {
                    // Channel taken by someone else
                    ui.key.disabled = true;
                    ui.lockBtn.disabled = true;
                    ui.status.innerText = isLocked ? "CHANNEL LOCKED" : "STATION BUSY";
                    document.getElementById('status-dot').className = "status-dot bg-red-500";
                    
                    if (isPressing) {
                        ui.alert.classList.remove('invisible');
                        ui.sender.innerText = activeUser;
                    } else {
                        ui.alert.classList.add('invisible');
                    }
                } else {
                    // Channel available or owned by me
                    ui.key.disabled = false;
                    ui.lockBtn.disabled = false;
                    ui.alert.classList.add('invisible');

                    if (isLockedByMe) {
                        ui.status.innerText = "OWNED BY YOU";
                        document.getElementById('status-dot').className = "status-dot bg-amber-500 shadow-[0_0_10px_#f59e0b]";
                        ui.lockLabel.innerText = "RELEASE CHANNEL";
                        ui.lockEmoji.innerText = "🔒";
                    } else {
                        ui.status.innerText = "AVAILABLE";
                        document.getElementById('status-dot').className = "status-dot bg-green-500 shadow-[0_0_10px_#22c55e]";
                        ui.lockLabel.innerText = "LOCK CHANNEL";
                        ui.lockEmoji.innerText = "🔓";
                    }
                }
            }, (err) => console.error("Sync Error:", err));
        }

        // ACTIONS
        window.pressKey = async (e) => {
            if (e.cancelable) e.preventDefault();
            if (ui.key.disabled) return;
            
            localPress = true;
            await updateDoc(channelDocRef, { 
                activeUser: stationId, 
                isPressing: true,
                isLocked: isLockedByMe
            });
        };

        window.releaseKey = async (e) => {
            if (!localPress) return;
            localPress = false;
            
            // If we have a lock, keep the user as activeUser but stop the press
            // If no lock, release the whole channel
            if (isLockedByMe) {
                await updateDoc(channelDocRef, { isPressing: false });
            } else {
                await updateDoc(channelDocRef, { activeUser: null, isPressing: false, isLocked: false });
            }
        };

        window.toggleLock = async () => {
            if (isLockedByMe) {
                // Unlock
                isLockedByMe = false;
                await updateDoc(channelDocRef, { activeUser: null, isPressing: false, isLocked: false });
            } else {
                // Attempt Lock
                isLockedByMe = true;
                await updateDoc(channelDocRef, { activeUser: stationId, isPressing: false, isLocked: true });
            }
        };

        // Safety release on close/hide
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isLockedByMe) {
                updateDoc(channelDocRef, { activeUser: null, isPressing: false, isLocked: false });
                isLockedByMe = false;
            }
        });

    </script>
</body>
</html>
