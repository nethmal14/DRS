<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TELECOM-98 MORSE RELAY</title>
    <style>
        :root {
            --bg-color: #000040;
            --panel-color: #c0c0c0;
            --text-neon: #00ff00;
            --text-cyan: #00ffff;
            --shadow-light: #ffffff;
            --shadow-dark: #808080;
            --border-width: 2px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 10px;
            color: var(--text-neon);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Win95 Style Panels */
        .window {
            background: var(--panel-color);
            border: var(--border-width) solid;
            border-color: var(--shadow-light) var(--shadow-dark) var(--shadow-dark) var(--shadow-light);
            width: 100%;
            max-width: 500px;
            padding: 4px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
        }

        .title-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            padding: 3px 6px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .content-area {
            border: var(--border-width) inset var(--shadow-dark);
            background: #000;
            padding: 15px;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Login Screen */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            width: 100%;
            gap: 10px;
        }

        /* Retro Buttons */
        .retro-btn {
            background: var(--panel-color);
            border: var(--border-width) solid;
            border-color: var(--shadow-light) var(--shadow-dark) var(--shadow-dark) var(--shadow-light);
            color: #000;
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .retro-btn:active:not(:disabled) {
            border-color: var(--shadow-dark) var(--shadow-light) var(--shadow-light) var(--shadow-dark);
            padding: 16px 14px 14px 16px;
        }

        .retro-btn:disabled {
            color: #808080;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .retro-btn.danger { color: #800000; }
        .retro-btn.success { color: #008000; }

        /* Indicators */
        .status-strip {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            background: #300;
            border: 1px solid #100;
        }

        .led.on {
            background: #f00;
            box-shadow: 0 0 8px #f00;
        }

        .led.active {
            background: #0f0;
            box-shadow: 0 0 8px #0f0;
        }

        /* Transmission UI */
        #transmit-btn {
            height: 180px;
            background: #222;
            border: 4px solid #444;
            color: var(--text-neon);
            font-size: 24px;
            width: 100%;
            user-select: none;
            -webkit-user-select: none;
        }

        #transmit-btn:active:not(:disabled) {
            background: #003300;
            border-color: var(--text-neon);
        }

        .display-box {
            background: #050505;
            border: 1px solid #1a1a1a;
            padding: 10px;
            min-height: 40px;
            color: var(--text-cyan);
            font-size: 14px;
        }

        .hidden { display: none !important; }

        .blinker {
            width: 100%;
            height: 5px;
            background: #111;
            margin-top: 5px;
        }
        .blinker.active { background: var(--text-neon); box-shadow: 0 0 10px var(--text-neon); }

        .channel-info {
            font-size: 12px;
            text-align: center;
        }

    </style>
</head>
<body>

    <div class="window">
        <div class="title-bar">
            <span>TERMINAL: MORSE_RELAY_V1.0</span>
            <span style="cursor:help">[?]</span>
        </div>

        <div class="content-area">
            <!-- Login Selection -->
            <div id="login-screen">
                <div style="font-size: 20px; color: var(--text-cyan)">SELECT CALLSIGN</div>
                <div class="btn-grid" id="callsign-grid">
                    <button class="retro-btn" data-id="NG">NG [OFFLINE]</button>
                    <button class="retro-btn" data-id="VD">VD [OFFLINE]</button>
                    <button class="retro-btn" data-id="ST">ST [OFFLINE]</button>
                </div>
                <div id="full-msg" class="hidden" style="color: red; font-weight: bold;">[!] CHANNEL FULL</div>
            </div>

            <!-- Main Terminal -->
            <div id="terminal" class="hidden">
                <div class="status-strip">
                    <div>USER: <span id="my-callsign" style="color:var(--text-cyan)">--</span></div>
                    <div>FREQ: 144.500 MHz</div>
                </div>

                <div class="display-box" id="info-display">
                    READY TO TRANSMIT...
                </div>
                
                <div class="blinker" id="visual-relay"></div>

                <div class="channel-info">
                    STATUS: <span id="lock-status" style="color:var(--text-neon)">OPEN</span><br>
                    ACTIVE TX: <span id="current-tx">NONE</span>
                </div>

                <button id="transmit-btn">PUSH TO TRANSMIT</button>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <button class="retro-btn success" id="lock-btn" style="font-size: 12px;">LOCK CH</button>
                    <button class="retro-btn danger" id="release-btn" style="font-size: 12px;">RELEASE CH</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, update, onDisconnect, serverTimestamp, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAhgK_yy1gySmtKb6Y6NGbaBvVAk2XaT3A",
            authDomain: "trip-tracker-57ce0.firebaseapp.com",
            databaseURL: "https://trip-tracker-57ce0-default-rtdb.firebaseio.com",
            projectId: "trip-tracker-57ce0",
            storageBucket: "trip-tracker-57ce0.firebasestorage.app",
            messagingSenderId: "236146303848",
            appId: "1:236146303848:web:933f1e79e8a97687db6cdd",
            measurementId: "G-ZBPCS6QPR5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // --- State ---
        let myId = null;
        let isTransmitting = false;
        let pressStartTime = 0;
        let audioCtx = null;
        let oscillator = null;
        let gainNode = null;

        // --- DOM Elements ---
        const loginScreen = document.getElementById('login-screen');
        const terminal = document.getElementById('terminal');
        const callsignButtons = document.querySelectorAll('#callsign-grid button');
        const transmitBtn = document.getElementById('transmit-btn');
        const lockBtn = document.getElementById('lock-btn');
        const releaseBtn = document.getElementById('release-btn');
        const infoDisplay = document.getElementById('info-display');
        const currentTxSpan = document.getElementById('current-tx');
        const lockStatusSpan = document.getElementById('lock-status');
        const visualRelay = document.getElementById('visual-relay');

        // --- Audio Logic ---
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            gainNode = audioCtx.createGain();
            gainNode.connect(audioCtx.destination);
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            
            oscillator = audioCtx.createOscillator();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            oscillator.connect(gainNode);
            oscillator.start();
        }

        function playBeep(active) {
            if (!gainNode) return;
            const now = audioCtx.currentTime;
            gainNode.gain.cancelScheduledValues(now);
            gainNode.gain.linearRampToValueAtTime(active ? 0.3 : 0, now + 0.01);
            if (active) {
                visualRelay.classList.add('active');
            } else {
                visualRelay.classList.remove('active');
            }
        }

        // --- Firebase Logic ---
        
        // Listen for users presence
        onValue(ref(db, 'users'), (snapshot) => {
            const users = snapshot.val() || {};
            let takenCount = 0;
            callsignButtons.forEach(btn => {
                const id = btn.dataset.id;
                if (users[id] && users[id].online) {
                    btn.disabled = true;
                    btn.textContent = `${id} [OCCUPIED]`;
                    takenCount++;
                } else {
                    btn.disabled = false;
                    btn.textContent = `${id} [OFFLINE]`;
                }
            });
            document.getElementById('full-msg').className = (takenCount >= 3) ? "" : "hidden";
        });

        // Login
        callsignButtons.forEach(btn => {
            btn.onclick = async () => {
                const id = btn.dataset.id;
                const userRef = ref(db, `users/${id}`);
                
                await set(userRef, { online: true, timestamp: serverTimestamp() });
                onDisconnect(userRef).remove();
                
                myId = id;
                document.getElementById('my-callsign').textContent = id;
                loginScreen.classList.add('hidden');
                terminal.classList.remove('hidden');
                initAudio();
            };
        });

        // Channel Lock Monitoring
        onValue(ref(db, 'channel/lock'), (snapshot) => {
            const lock = snapshot.val();
            if (lock && lock.locked) {
                lockStatusSpan.textContent = `LOCKED BY ${lock.by}`;
                lockStatusSpan.style.color = 'red';
                if (lock.by !== myId) {
                    transmitBtn.disabled = true;
                    lockBtn.disabled = true;
                    releaseBtn.disabled = true;
                } else {
                    transmitBtn.disabled = false;
                    lockBtn.disabled = true;
                    releaseBtn.disabled = false;
                }
            } else {
                lockStatusSpan.textContent = "OPEN";
                lockStatusSpan.style.color = "var(--text-neon)";
                transmitBtn.disabled = false;
                lockBtn.disabled = false;
                releaseBtn.disabled = true;
            }
        });

        // Signal Relay Listener (Live Audio)
        onValue(ref(db, 'signals'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            
            // We find the newest signal
            const keys = Object.keys(data);
            const latestKey = keys[keys.length - 1];
            const signal = data[latestKey];

            // Safety: Don't echo own audio if we are the transmitter (handled locally for zero lag)
            if (signal.by !== myId) {
                currentTxSpan.textContent = signal.active ? signal.by : "NONE";
                infoDisplay.textContent = signal.active ? `RECEIVING: ${signal.by}` : "READY TO TRANSMIT...";
                playBeep(signal.active);
            }
        });

        // Transmit Actions
        const startTransmit = () => {
            if (transmitBtn.disabled || isTransmitting) return;
            isTransmitting = true;
            pressStartTime = Date.now();
            
            // Set local audio for zero lag feedback
            playBeep(true);
            currentTxSpan.textContent = myId;
            infoDisplay.textContent = "TRANSMITTING...";

            // Update Firebase for others
            set(ref(db, 'signals/live'), {
                by: myId,
                active: true,
                timestamp: serverTimestamp()
            });
        };

        const stopTransmit = () => {
            if (!isTransmitting) return;
            isTransmitting = false;
            
            playBeep(false);
            currentTxSpan.textContent = "NONE";
            infoDisplay.textContent = "SIGNAL SENT";

            set(ref(db, 'signals/live'), {
                by: myId,
                active: false,
                timestamp: serverTimestamp()
            });
        };

        // UI Events
        transmitBtn.onmousedown = (e) => { e.preventDefault(); startTransmit(); };
        transmitBtn.onmouseup = (e) => { e.preventDefault(); stopTransmit(); };
        transmitBtn.ontouchstart = (e) => { e.preventDefault(); startTransmit(); };
        transmitBtn.ontouchend = (e) => { e.preventDefault(); stopTransmit(); };

        lockBtn.onclick = () => {
            set(ref(db, 'channel/lock'), {
                locked: true,
                by: myId
            });
        };

        releaseBtn.onclick = () => {
            set(ref(db, 'channel/lock'), {
                locked: false,
                by: null
            });
        };

        // Cleanup on close
        window.onbeforeunload = () => {
            if (myId) {
                remove(ref(db, `users/${myId}`));
                onValue(ref(db, 'channel/lock'), (snap) => {
                    if (snap.val()?.by === myId) {
                        set(ref(db, 'channel/lock'), { locked: false });
                    }
                }, { onlyOnce: true });
            }
        };

    </script>
</body>
</html>
