<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SECURE COMM-LINK | PROJECT MORSE</title>
    <style>
        :root {
            --crt-amber: #ffb000;
            --crt-green: #33ff33;
            --bg-dark: #0a0c0a;
            --panel-olive: #2b3020;
            --glow: 0 0 10px rgba(255, 176, 0, 0.5);
        }

        @font-face {
            font-family: 'Terminal';
            src: local('Courier New'), local('Courier'), monospace;
        }

        * { 
            box-sizing: border-box; 
            cursor: crosshair; 
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--crt-amber);
            font-family: 'Terminal', monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* CRT Overlay Effects */
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .crt-scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(255,176,0,0.05) 50%, rgba(0,0,0,0) 100%);
            background-size: 100% 20px;
            animation: scanline 8s linear infinite;
            pointer-events: none;
            z-index: 1001;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* Selector Panel */
        #selector-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            border: 2px solid var(--panel-olive);
            padding: 20px;
            text-align: center;
        }

        .callsign-btn {
            background: transparent;
            border: 2px solid var(--crt-amber);
            color: var(--crt-amber);
            padding: 20px 40px;
            margin: 10px;
            font-size: 20px;
            width: 100%;
            max-width: 300px;
            transition: all 0.2s;
        }

        .callsign-btn:not(:disabled):hover {
            background: var(--crt-amber);
            color: var(--bg-dark);
            box-shadow: var(--glow);
        }

        .callsign-btn:disabled {
            border-color: #444;
            color: #444;
            opacity: 0.5;
        }

        /* Main Console */
        #console {
            width: 800px;
            max-width: 95vw;
            height: 90vh;
            border: 4px solid #1a1c1a;
            background: #151815;
            padding: 15px;
            box-shadow: inset 0 0 50px rgba(0,0,0,1);
            position: relative;
            display: none;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid var(--crt-amber);
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-size: 12px;
        }

        /* Status Panel */
        .status-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: rgba(0,0,0,0.4);
            padding: 10px;
            border: 1px solid var(--panel-olive);
            margin-bottom: 15px;
        }

        .status-box {
            border-left: 3px solid var(--crt-amber);
            padding-left: 8px;
            font-size: 10px;
        }

        .status-val {
            font-size: 16px;
            font-weight: bold;
            display: block;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-val.locked { color: #ff4444; }
        .status-val.open { color: var(--crt-green); }

        /* Transmitter Section */
        .comm-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .lamp-container {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #111;
            border: 4px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        #signal-lamp {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #220000;
            transition: background 0.05s;
        }

        #signal-lamp.active {
            background: #ff0000;
            box-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .mech-btn {
            flex: 1;
            padding: 15px 10px;
            background: var(--panel-olive);
            border: 3px solid #3a412b;
            border-bottom: 6px solid #1a1e12;
            color: var(--crt-amber);
            font-family: 'Terminal', monospace;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
            transition: all 0.1s;
            touch-action: manipulation;
        }

        .mech-btn:active:not(:disabled) {
            transform: translateY(4px);
            border-bottom: 2px solid #1a1e12;
        }

        .mech-btn:disabled {
            opacity: 0.3;
            filter: grayscale(1);
        }

        #transmit-btn {
            background: #4a543a;
            font-size: 20px;
            width: 100%;
            padding: 30px;
        }

        #transmit-btn.active {
            background: #ffb000;
            color: #000;
        }

        .footer {
            margin-top: 20px;
            font-size: 9px;
            opacity: 0.5;
            text-align: center;
            letter-spacing: 1px;
        }

        .log-display {
            height: 50px;
            background: rgba(0,0,0,0.8);
            border: 1px solid var(--panel-olive);
            margin-top: 15px;
            padding: 8px;
            font-size: 11px;
            color: var(--crt-green);
            overflow: hidden;
        }

        @media (min-width: 600px) {
            #console { padding: 30px; }
            .header { font-size: 14px; }
            .status-box { font-size: 12px; }
            .status-val { font-size: 20px; }
            .lamp-container { width: 120px; height: 120px; }
            #signal-lamp { width: 60px; height: 60px; }
            .mech-btn { font-size: 18px; padding: 25px; }
            .log-display { height: 60px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="crt-overlay"></div>
    <div class="crt-scanline"></div>

    <!-- Callsign Selection -->
    <div id="selector-overlay">
        <h1 style="letter-spacing: 5px; margin-bottom: 20px; font-size: 24px;">SELECT OPERATOR ID</h1>
        <div id="loading-msg">INITIALIZING ENCRYPTION...</div>
        <div id="buttons-container" style="display: none; width: 100%; display: flex; flex-direction: column; align-items: center;">
            <button class="callsign-btn" id="btn-NG" onclick="selectCallsign('NG')">CALLSIGN: NG</button>
            <button class="callsign-btn" id="btn-VD" onclick="selectCallsign('VD')">CALLSIGN: VD</button>
            <button class="callsign-btn" id="btn-ST" onclick="selectCallsign('ST')">CALLSIGN: ST</button>
        </div>
        <div id="occupied-msg" style="display: none; color: #ff4444; margin-top: 20px; font-size: 18px;">CHANNEL OCCUPIED - ALL SLOTS TAKEN</div>
    </div>

    <!-- Main Interface -->
    <div id="console">
        <div class="header">
            <div>STATION: <span id="my-callsign">--</span></div>
            <div>STATUS: <span id="conn-status">ENCRYPTED</span></div>
        </div>

        <div class="status-panel">
            <div class="status-box">
                CHANNEL STATUS
                <span id="channel-lock-text" class="status-val open">OPEN</span>
            </div>
            <div class="status-box">
                LOCK HOLDER
                <span id="lock-holder-text" class="status-val">NONE</span>
            </div>
            <div class="status-box">
                ACTIVE TX
                <span id="tx-holder-text" class="status-val">IDLE</span>
            </div>
            <div class="status-box">
                SIGNAL STRENGTH
                <span class="status-val" style="color: var(--crt-green)">98.4% CLR</span>
            </div>
        </div>

        <div class="comm-center">
            <div class="lamp-container">
                <div id="signal-lamp"></div>
            </div>

            <button id="transmit-btn" class="mech-btn" onmousedown="startTransmit()" onmouseup="stopTransmit()" onmouseleave="stopTransmit()" ontouchstart="event.preventDefault(); startTransmit()" ontouchend="event.preventDefault(); stopTransmit()">
                TRANSMIT [KEY]
            </button>

            <div class="btn-group">
                <button id="lock-btn" class="mech-btn" onclick="toggleChannelLock()">LOCK</button>
                <button id="release-btn" class="mech-btn" onclick="releaseChannel()" disabled>RELEASE</button>
            </div>
        </div>

        <div class="log-display" id="log">
            SYSTEM STANDBY... READY FOR INPUT.
        </div>

        <div class="footer">
            PROPERTY OF UNITED STATES GOVERNMENT - CLASSIFIED - 1984
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, onDisconnect, serverTimestamp, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAhgK_yy1gySmtKb6Y6NGbaBvVAk2XaT3A",
            authDomain: "trip-tracker-57ce0.firebaseapp.com",
            databaseURL: "https://trip-tracker-57ce0-default-rtdb.firebaseio.com",
            projectId: "trip-tracker-57ce0",
            storageBucket: "trip-tracker-57ce0.firebasestorage.app",
            messagingSenderId: "236146303848",
            appId: "1:236146303848:web:933f1e79e8a97687db6cdd",
            measurementId: "G-ZBPCS6QPR5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // State
        let myCallsign = null;
        let isTransmitting = false;
        let audioCtx = null;
        let oscillator = null;
        let gainNode = null;

        // DB Refs
        const presenceRef = ref(db, 'presence');
        const channelRef = ref(db, 'channel');
        const lockRef = ref(db, 'channel/lock');
        const txRef = ref(db, 'channel/transmission');

        // Audio Setup
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.connect(audioCtx.destination);
            
            oscillator = audioCtx.createOscillator();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(700, audioCtx.currentTime);
            oscillator.connect(gainNode);
            oscillator.start();
        }

        function playBeep(active) {
            if (!gainNode) initAudio();
            const now = audioCtx.currentTime;
            gainNode.gain.setTargetAtTime(active ? 0.2 : 0, now, 0.01);
        }

        // Monitoring Presence and Locks
        onValue(presenceRef, (snapshot) => {
            const data = snapshot.val() || {};
            const taken = Object.values(data).map(p => p.callsign);
            
            ['NG', 'VD', 'ST'].forEach(call => {
                const btn = document.getElementById(`btn-${call}`);
                if (taken.includes(call) && call !== myCallsign) {
                    btn.disabled = true;
                    btn.innerText = `[${call}] IN USE`;
                } else {
                    btn.disabled = false;
                    btn.innerText = `CALLSIGN: ${call}`;
                }
            });

            const allTaken = ['NG', 'VD', 'ST'].every(c => taken.includes(c));
            document.getElementById('occupied-msg').style.display = (allTaken && !myCallsign) ? 'block' : 'none';
            document.getElementById('buttons-container').style.display = 'flex';
            document.getElementById('loading-msg').style.display = 'none';
        });

        onValue(channelRef, (snapshot) => {
            const data = snapshot.val() || {};
            const lock = data.lock || { locked: false, by: "NONE" };
            const tx = data.transmission || { active: false, by: "NONE" };

            // UI Updates
            const lockStatus = document.getElementById('channel-lock-text');
            const holderText = document.getElementById('lock-holder-text');
            const txText = document.getElementById('tx-holder-text');
            const lamp = document.getElementById('signal-lamp');
            const transmitBtn = document.getElementById('transmit-btn');
            const lockBtn = document.getElementById('lock-btn');
            const releaseBtn = document.getElementById('release-btn');

            // Lock Logic
            if (lock.locked) {
                lockStatus.innerText = "LOCKED";
                lockStatus.className = "status-val locked";
                holderText.innerText = lock.by;
            } else {
                lockStatus.innerText = "OPEN";
                lockStatus.className = "status-val open";
                holderText.innerText = "NONE";
            }

            // TX Logic
            if (tx.active) {
                txText.innerText = tx.by;
                lamp.classList.add('active');
                if (tx.by !== myCallsign) playBeep(true);
            } else {
                txText.innerText = "IDLE";
                lamp.classList.remove('active');
                playBeep(false);
            }

            // Controls Blocking
            const isAnotherLocking = lock.locked && lock.by !== myCallsign;
            const isAnotherTransmitting = tx.active && tx.by !== myCallsign;

            transmitBtn.disabled = isAnotherLocking || isAnotherTransmitting;
            lockBtn.disabled = lock.locked;
            releaseBtn.disabled = !lock.locked || lock.by !== myCallsign;

            if (isAnotherLocking) document.getElementById('log').innerText = `CHANNEL LOCKED BY ${lock.by}... STAND BY.`;
            else if (isAnotherTransmitting) document.getElementById('log').innerText = `INCOMING SIGNAL FROM ${tx.by}...`;
            else document.getElementById('log').innerText = "CHANNEL CLEAR. READY.";
        });

        // Global functions (exposed to window for HTML attributes)
        window.selectCallsign = async function(call) {
            myCallsign = call;
            const userRef = ref(db, `presence/${call}`);
            
            // Register presence
            await set(userRef, { callsign: call, timestamp: serverTimestamp() });
            onDisconnect(userRef).remove();
            
            // Switch UI
            document.getElementById('selector-overlay').style.display = 'none';
            document.getElementById('console').style.display = 'block';
            document.getElementById('my-callsign').innerText = call;
            
            initAudio();
        };

        window.startTransmit = function() {
            if (document.getElementById('transmit-btn').disabled) return;
            isTransmitting = true;
            document.getElementById('transmit-btn').classList.add('active');
            set(txRef, { active: true, by: myCallsign });
            playBeep(true);
        };

        window.stopTransmit = function() {
            if (!isTransmitting) return;
            isTransmitting = false;
            document.getElementById('transmit-btn').classList.remove('active');
            set(txRef, { active: false, by: myCallsign });
            playBeep(false);
        };

        window.toggleChannelLock = function() {
            set(lockRef, { locked: true, by: myCallsign });
        };

        window.releaseChannel = function() {
            set(lockRef, { locked: false, by: "NONE" });
        };

        // Handle window close
        window.addEventListener('beforeunload', () => {
            if (myCallsign) {
                // Ensure lock and TX are released if user leaves
                get(lockRef).then(snap => {
                    if (snap.val()?.by === myCallsign) set(lockRef, { locked: false, by: "NONE" });
                });
                get(txRef).then(snap => {
                    if (snap.val()?.by === myCallsign) set(txRef, { active: false, by: "NONE" });
                });
            }
        });

    </script>
</body>
</html>
